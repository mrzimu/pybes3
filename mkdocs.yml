site_name: Documentation for pybes3
repo_url: https://github.com/mrzimu/pybes3
site_author: Mingrun Li

theme:
  name: material
  features:
    - toc
    - search
    - search.suggest
    - footer
    - content.code.copy
    - content.tabs.link
    - navigation.top
    - navigation.sections

  palette:
    # Palette toggle for automatic mode
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 3
            separate_signature: false

nav:
  - Home: index.md
  - Installation: installation.md
  - Convention:
      - Unit: convention/unit.md
      - Global ID (gid): convention/gid.md
  - User manual:
      - Data reading: user-manual/data-reading.md
      - Identifier: user-manual/identifier.md
      - Detector:
          - MDC: user-manual/detector/mdc.md
          - TOF: user-manual/detector/tof.md
          - EMC: user-manual/detector/emc.md
          - CGEM: user-manual/detector/cgem.md
      - Helix operations: user-manual/helix.md
  - API Reference:
      - pybes3: api/pybes3.md
      - pybes3.besio: api/pybes3.besio.md
      - pybes3.detectors: api/pybes3.detectors.md
      - pybes3.helix: api/pybes3.helix.md
      - pybes3.identifier: api/pybes3.identifier.md
      - pybes3.digi_id (deprecated): api/pybes3.digi_id.md
